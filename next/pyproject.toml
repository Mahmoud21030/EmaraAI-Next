[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emaraai-next"
version = "0.1.0"
description = "EmaraAI Next durable kernel: state machines, outbox, leases/fencing, messaging, snapshots and resume."
requires-python = ">=3.11"
dependencies = ["starlette>=0.37", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
emaraai-next = "emaraai_next.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
