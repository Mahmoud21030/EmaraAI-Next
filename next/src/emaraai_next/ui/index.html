<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>EmaraAI Next</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --mute:#5b6470; --line:#e3e6ea; --ok:#1f8a4c; --warn:#b26b00; --bad:#c62828; --acc:#3563e9; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111418; --card:#1a1f25; --ink:#e8ebef; --mute:#9aa4b0; --line:#2a3139; } }
  * { box-sizing:border-box } body { margin:0; font:15px/1.5 system-ui, "Segoe UI", Tahoma, sans-serif; background:var(--bg); color:var(--ink) }
  header { padding:16px; display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap }
  h1 { font-size:20px; margin:0 } .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--ok); margin-inline-end:6px }
  main { padding:0 16px 24px; display:grid; gap:12px; max-width:960px; margin:auto }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px }
  .row { display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap } .mute { color:var(--mute); font-size:13px }
  table { width:100%; border-collapse:collapse; margin-top:8px } td { padding:6px 4px; border-top:1px solid var(--line); vertical-align:top }
  .st { font-size:12px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); white-space:nowrap }
  .RUNNING { color:var(--acc) } .REVIEW { color:var(--warn) } .DONE { color:var(--ok) } .FAILED,.BLOCKED { color:var(--bad) }
  .empty { text-align:center; padding:32px; color:var(--mute) }
  .need { border-color:var(--acc) } h2 { font-size:15px; margin:0 0 8px }
  textarea { width:100%; min-height:56px; font:inherit; padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink) }
  button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; min-height:40px }
  button.go { background:var(--acc); color:#fff; border-color:var(--acc) } .acts { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap }
  .ev { font-size:12px; color:var(--mute); padding:3px 0; border-top:1px solid var(--line); direction:ltr; text-align:left }
</style>
</head>
<body>
<header><h1><span class="dot" id="dot"></span>EmaraAI Next</h1><span class="mute" id="node"></span></header>
<main><div id="need"></div><div id="main" style="display:grid;gap:12px"><div class="card empty">جاري التحميل…</div></div><div id="events"></div></main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function load() {
  try {
    const r = await (await fetch("v1/overview")).json();
    const o = r.result;
    document.getElementById("dot").style.background = "var(--ok)";
    document.getElementById("node").textContent = `${o.node} · ${new Date().toLocaleTimeString()}`;
    const m = document.getElementById("main");
    if (!o.projects.length) { m.innerHTML = `<div class="card empty">مفيش مشاريع لسه.<br><span class="mute">emaraai-next init examples/smoke-project.json</span></div>`; return; }
    m.innerHTML = o.projects.map(p => `
      <div class="card"><div class="row"><b>${esc(p.name)}</b><span class="mute">${esc(p.id)} · ${esc(p.status)} · ${p.done}/${p.total} خلص</span></div>
      ${p.tasks.length ? `<table>${p.tasks.map(t => `<tr><td>${esc(t.title)}<div class="mute">${esc(t.id)} · ${esc(t.assignee || "-")}${t.last_step ? " · " + esc(t.last_step) : ""}</div></td>
        <td style="text-align:left"><span class="st ${esc(t.status)}">${esc(t.status)}</span></td></tr>`).join("")}</table>` : `<div class="mute">مفيش tasks مفتوحة</div>`}
      </div>`).join("");
  } catch (e) { document.getElementById("dot").style.background = "var(--bad)"; }
}
const post = (url, body) => fetch(url, {method: "POST", headers: {"content-type": "application/json", "x-emaraai": "1"}, body: JSON.stringify(body)}).then(r => r.json());
let typing = false;
async function loadOwner() {
  if (typing) return;
  const o = (await (await fetch("v1/owner")).json()).result;
  const n = document.getElementById("need");
  const items = [
    ...(o.approvals || []).map(a => `<div class="card need" style="border-color:var(--bad)"><h2>موافقة مطلوبة: ${esc(a.reason)}</h2>
      <div class="mute">${esc(a.by)} عايز يشغّل:</div><div style="direction:ltr;text-align:left;font-family:monospace">${esc(a.action)}</div>
      <div class="acts"><button class="go" onclick="decide('${esc(a.id)}', true)">موافق</button><button onclick="decide('${esc(a.id)}', false)">رفض</button></div></div>`),
    ...o.questions.map(q => `<div class="card need"><h2>سؤال من ${esc(q.from)} · ${esc(q.project)}</h2><div>${esc(q.text)}</div>
      <textarea id="a-${esc(q.id)}" placeholder="ردك…" onfocus="typing=true" onblur="typing=false"></textarea>
      <div class="acts"><button class="go" onclick="answer('${esc(q.id)}')">ابعت الرد</button></div></div>`),
    ...o.review.map(t => `<div class="card need"><h2>مراجعة: ${esc(t.title)} · ${esc(t.project)}</h2>
      <div class="mute">${esc(t.assignee)} · ${esc(t.id)}</div><div>${esc(t.summary)}</div>
      <div class="mute">${(t.evidence || []).map(esc).join("<br>")}</div>
      <textarea id="n-${esc(t.id)}" placeholder="ملاحظة (اختياري)" onfocus="typing=true" onblur="typing=false"></textarea>
      <div class="acts"><button class="go" onclick="review('${esc(t.id)}', true)">قبول</button><button onclick="review('${esc(t.id)}', false)">رجّعه للتعديل</button></div></div>`)];
  n.innerHTML = items.length ? `<div class="mute" style="margin:4px 2px">محتاجك (${items.length})</div><div style="display:grid;gap:12px;margin-bottom:12px">${items.join("")}</div>` : "";
  document.getElementById("events").innerHTML = `<div class="card"><h2>آخر الأحداث ${o.browser ? "· Chrome متصل ✓" : "· Chrome مش متصل"}</h2>` +
    o.events.map(e => `<div class="ev">${new Date(e.ts * 1000).toLocaleTimeString()} · ${esc(e.kind)} · ${esc(e.subject)}</div>`).join("") + "</div>";
}
async function answer(id) { const v = document.getElementById("a-" + id).value.trim(); if (!v) return; typing = false; await post(`v1/questions/${id}/answer`, {text: v}); refresh(); }
async function review(id, ok) { const v = (document.getElementById("n-" + id) || {}).value || ""; typing = false; await post(`v1/tasks/${id}/review`, {accept: ok, note: v}); refresh(); }
async function decide(id, ok) { await post(`v1/approvals/${id}`, {approve: ok}); refresh(); }
function refresh() { load(); loadOwner().catch(() => {}); }
refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
