name: next-tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -p no:cacheprovider
  install-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install.ps1
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File next\scripts\install.ps1
      - name: setup with default answers
        shell: pwsh
        run: |
          & "$env:USERPROFILE\.emaraai-next\venv\Scripts\emaraai-next.exe" setup --yes
          if (-not (Test-Path "$env:USERPROFILE\.emaraai-next\emaraai.toml")) { throw "no config written" }
          $v = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "EmaraAI Next" -ErrorAction SilentlyContinue
          if (-not $v) { throw "autostart was not registered" }
      - name: serve answers /v1/health and the page
        shell: pwsh
        run: |
          $exe = "$env:USERPROFILE\.emaraai-next\venv\Scripts\emaraai-next.exe"
          $p = Start-Process $exe -ArgumentList "serve" -PassThru -WorkingDirectory "$env:USERPROFILE\.emaraai-next"
          $ok = $false
          foreach ($i in 1..30) { Start-Sleep 1; try { $r = Invoke-RestMethod http://127.0.0.1:8810/v1/health; if ($r.ok) { $ok = $true; break } } catch {} }
          $html = (Invoke-WebRequest http://127.0.0.1:8810/ -UseBasicParsing).Content
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "the node did not answer" }
          if ($html -notmatch "EmaraAI Next") { throw "the page did not load" }
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t emaraai-next next
      - run: |
          docker run -d --name emaraai-ci -p 8810:8810 emaraai-next
          for i in $(seq 1 30); do curl -sf 127.0.0.1:8810/v1/health && exit 0; sleep 1; done
          docker logs emaraai-ci; exit 1
