# Runs EmaraAI Next tasks on a disposable GitHub runner (ADR-0005).
# State lives on the `emaraai-state` branch of the project's repository; code goes to emara/<project>/<task>/<attempt> branches.
# One run per project at a time (concurrency group), so two runners never work on the same project state.
# Runners never join Tailscale (no device is added per run): they only use the git remote / Drive backups.
name: emaraai-runner
on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project id (P-...). Leave empty together with 'init' to create one."
        required: false
      init:
        description: "Path of a project JSON in this repo to create the project (first run only)"
        required: false
      remote:
        description: "Git remote of the project (default: this repository)"
        required: false
      os:
        description: "Runner OS"
        type: choice
        options: [windows-latest, ubuntu-latest]
        default: windows-latest
      max_tasks:
        description: "Tasks to run in this job"
        default: "3"
permissions:
  contents: write
concurrency:
  group: emaraai-${{ inputs.project || inputs.init }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 340          # GitHub kills jobs at 360; leave time for the final checkpoint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ./next
      - name: Git identity and remote
        shell: bash
        run: |
          git config --global user.name "EmaraAI Next"
          git config --global user.email "next@emaraai.local"
          # the token stays in git config, never in the remote URL (that URL is saved in the project state)
          git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"
          REMOTE="${{ inputs.remote }}"
          if [ -z "$REMOTE" ]; then REMOTE="https://github.com/${{ github.repository }}.git"; fi
          echo "REMOTE=$REMOTE" >> "$GITHUB_ENV"
      - name: Create project
        if: ${{ inputs.init != '' }}
        shell: bash
        run: python -m emaraai_next.worker --project new --init "${{ inputs.init }}" --remote "$REMOTE" --root "$RUNNER_TEMP/emaraai"
      - name: Work
        if: ${{ inputs.project != '' }}
        shell: bash
        run: python -m emaraai_next.worker --project "${{ inputs.project }}" --remote "$REMOTE" --name "gh-${{ github.run_id }}" --root "$RUNNER_TEMP/emaraai" --max-tasks "${{ inputs.max_tasks }}"
