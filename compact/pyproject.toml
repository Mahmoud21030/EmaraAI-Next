[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "emaraai-hub"
version = "3.5.0"
description = "Layered MCP hub: Master/Agent ChatGPT chats, inbox, mandatory memory, supervisor, n8n, PC tools."
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3,<3",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pyyaml>=6",
  "playwright>=1.45",
]

[project.optional-dependencies]
playwright = ["playwright>=1.45"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
emaraai-hub = "emaraai_hub.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emaraai_hub = ["ui/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
